name: Secret Scan

on:
  push:
    branches: [master, security/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v4
        with:
          persist-credentials: false
      - name: Scan tracked files for obvious secrets
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = (
              ("private key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")),
              ("GitHub token", re.compile(r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{20,}\b")),
              ("GitHub fine-grained token", re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Telegram bot token", re.compile(r"\b\d{6,12}:[A-Za-z0-9_-]{30,}\b")),
          )
          findings = []
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8"))
              try:
                  if path.stat().st_size > 1_000_000:
                      continue
                  source = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              for number, line in enumerate(source.splitlines(), start=1):
                  for label, pattern in patterns:
                      if pattern.search(line):
                          findings.append(f"{path}:{number}: possible {label}")
          if findings:
              print("\n".join(findings))
              sys.exit(1)
          PY
