name: CI

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  DB_URL: jdbc:postgresql://localhost:5432/airport_repository
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_POOL_SIZE: '4'

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: airport_repository
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airport_repository"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize database
        run: |
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:15 --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -U postgres -d airport_repository -v ON_ERROR_STOP=1 \
            < src/main/resources/db/airport.sql

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
